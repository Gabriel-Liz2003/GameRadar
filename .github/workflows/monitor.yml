name: "GameRadar • monitor"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "gameradar/**"
      - "config/**"
      - ".github/workflows/monitor.yml"
  schedule:
    - cron: "23 * * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: gameradar-hourly
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      pages_ready: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar anúncios autorizados
        run: python -m gameradar.core collect
        continue-on-error: true
        env:
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
      - name: Persistir anúncios e fila ANTES de notificar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/feed.json
          if ! git diff --cached --quiet; then
            git commit -m "data: monitorar preços e anúncios"
            git pull --rebase origin main
            git push
          fi
      - name: Notificar com digest (1 notificação por coleta)
        run: python -m gameradar.core notify
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Persistir confirmação dos alertas
        if: always()
        run: |
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "data: confirmar alertas enviados"
            git pull --rebase origin main
            git push
          fi
      - name: Detectar GitHub Pages sem variável manual
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages está habilitado."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Ative GitHub Pages em Settings -> Pages -> Source: GitHub Actions."
          fi
      - name: Montar PWA
        if: steps.pages.outputs.enabled == 'true'
        run: |
          mkdir -p public/data
          cp -a site/. public/
          cp data/feed.json public/data/feed.json
      - name: Preparar GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: public
  deploy:
    if: needs.collect.outputs.pages_ready == 'true'
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar GameRadar
        id: deployment
        uses: actions/deploy-pages@v4
